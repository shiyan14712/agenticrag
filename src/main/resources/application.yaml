server:
  port: 8080
  tomcat:
    max-swallow-size: -1

agenticrag:
  kafka:
    topics:
      parse-request: doc-parse-request
      vectorize-request: doc-vectorize-request
      delete-request: doc-delete-request
      dead-letter: doc-dlq
    retry:
      max-attempts: 3
      interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
    outbox:
      enabled: true
      batch-size: 20
      poll-interval-ms: 2000
      dispatch-timeout-ms: 5000
    consume:
      processing-timeout-ms: 60000

logging:
  level:
    # 关闭 MyBatis SQL 语句级别的全量日志，防止定时轮询任务（OutboxDispatcher）每 2s 刷一次 SQL 刷屏
    # 若需要调试某个具体 mapper，可临时把对应包改回 debug
    com.yoswell.agenticrag.retrieval.document.reliability.mapper: info
    # MyBatis 全局日志也压到 warn，避免框架本身的 SqlSession 生命周期日志刷屏
    org.mybatis: info
    org.apache.ibatis.transaction: info
    com.baomidou.mybatisplus: info
